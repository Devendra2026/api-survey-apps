name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "12.5.1"

jobs:
  check:
    name: Lint, test, migrate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: survey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d survey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/survey?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/survey?schema=public
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      CLERK_PUBLISHABLE_KEY: pk_test_ci
      CORS_ORIGIN: http://localhost:3000
      STORAGE_PROVIDER: s3
      AWS_REGION: ap-south-1
      AWS_S3_BUCKET: ci-bucket
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      SWAGGER_ENABLED: "false"
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: CI / Checkout
        uses: actions/checkout@v4

      - name: CI / Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: CI / Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: CI / Verify toolchain versions
        run: |
          set -euo pipefail
          NODE_VER="$(node --version)"
          PNPM_VER="$(pnpm --version)"
          echo "node=${NODE_VER}"
          echo "pnpm=${PNPM_VER}"
          case "${NODE_VER}" in
            v24.*) ;;
            *)
              echo "Expected Node.js 24.x, got ${NODE_VER}" >&2
              exit 1
              ;;
          esac
          case "${PNPM_VER}" in
            12.5.*) ;;
            *)
              echo "Expected pnpm 12.5.x (packageManager), got ${PNPM_VER}" >&2
              exit 1
              ;;
          esac

      - name: CI / Install
        run: pnpm install --frozen-lockfile

      - name: CI / Prisma generate
        run: pnpm db:generate

      - name: CI / Build packages
        run: pnpm turbo build --filter=./packages/*

      - name: CI / Lint
        run: pnpm lint

      - name: CI / Typecheck
        run: pnpm typecheck

      - name: CI / Mobile lint
        run: pnpm --filter mobile lint

      - name: CI / Mobile typecheck
        run: pnpm --filter mobile typecheck

      - name: CI / Prisma migrate deploy
        run: pnpm db:deploy

      - name: CI / API tests
        run: pnpm --filter api test:ci

      - name: CI / Build
        run: pnpm build

      - name: CI / Docker smoke API
        run: |
          docker build \
            -f apps/api/Dockerfile \
            --build-arg PNPM_VERSION=${{ env.PNPM_VERSION }} \
            -t api-survey-api:ci .

      - name: CI / Docker smoke web
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg PNPM_VERSION=${{ env.PNPM_VERSION }} \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/dashboard \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/dashboard \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY= \
            -t api-survey-web:ci .

      - name: CI / Docker smoke worker
        run: |
          docker build \
            -f apps/worker/Dockerfile \
            --build-arg PNPM_VERSION=${{ env.PNPM_VERSION }} \
            -t api-survey-worker:ci .

      - name: CI / Validate Dokploy compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
          DATABASE_URL: postgresql://postgres:ci-postgres-password@postgres:5432/survey?schema=public
          DIRECT_URL: postgresql://postgres:ci-postgres-password@postgres:5432/survey?schema=public
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
        run: docker compose -f docker-compose.dokploy.yml config
