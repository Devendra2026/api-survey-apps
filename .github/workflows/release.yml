name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: false
        default: latest
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'api-survey-prod' }}

jobs:
  publish:
    name: Build, push ECR, migrate, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Secrets cannot be referenced in `if:` — map to env first, then gate on env.
    env:
      DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-api:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL=/dashboard
            NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL=/dashboard
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-web:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-web:latest

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-worker:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-worker:latest

      - name: Trigger Dokploy webhook
        if: env.DOKPLOY_WEBHOOK_URL != ''
        run: |
          curl -fsSL -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${{ steps.meta.outputs.tag }}\"}"

      - name: Health check (ALB)
        if: ${{ vars.HEALTHCHECK_API_URL != '' }}
        env:
          HEALTHCHECK_API_URL: ${{ vars.HEALTHCHECK_API_URL }}
          HEALTHCHECK_WEB_URL: ${{ vars.HEALTHCHECK_WEB_URL }}
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS "$HEALTHCHECK_API_URL/health" >/dev/null; then
              echo "API healthy"
              break
            fi
            echo "Waiting for API ($i/30)..."
            sleep 10
          done
          curl -fsS "$HEALTHCHECK_API_URL/ready" >/dev/null
          if [ -n "$HEALTHCHECK_WEB_URL" ]; then
            curl -fsS "$HEALTHCHECK_WEB_URL" >/dev/null
          fi
          echo "Post-deploy health checks passed"
