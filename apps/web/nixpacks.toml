# Nixpacks config for apps/web — use with build context = repository root:
#   NIXPACKS_CONFIG_FILE=apps/web/nixpacks.toml
#
# Set NEXT_PUBLIC_* in Dokploy env at BUILD time (baked into the Next.js client bundle).
# Runtime uses `next start` (full install). Docker path uses Next standalone instead.

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
CI = "true"
HUSKY = "0"
NODE_ENV = "production"
PORT = "3000"
HOSTNAME = "0.0.0.0"
NEXT_TELEMETRY_DISABLED = "1"

[phases.setup]
aptPkgs = ["...", "curl", "wget"]

[phases.install]
# --prod=false: pnpm would otherwise skip turbo/typescript under NODE_ENV=production.
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
# Explicit override (no "...") so Nixpacks does not also run a root-wide turbo build.
cmds = ["pnpm turbo build --filter=web..."]

[start]
cmd = "pnpm --filter web start"
