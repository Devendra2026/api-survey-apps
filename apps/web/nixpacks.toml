providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_ENV = "production"
PORT = "3000"
HOSTNAME = "0.0.0.0"
NEXT_TELEMETRY_DISABLED = "1"

[phases.setup]
aptPkgs = ["...", "curl", "wget"]

[phases.build]
cmds = ["...", "pnpm turbo build --filter=web..."]

[start]
cmd = "pnpm --filter web start"
