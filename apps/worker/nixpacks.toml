# Nixpacks config for apps/worker — use with build context = repository root:
#   NIXPACKS_CONFIG_FILE=apps/worker/nixpacks.toml

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
CI = "true"
HUSKY = "0"
NODE_ENV = "production"
WORKER_PORT = "4001"
HOSTNAME = "0.0.0.0"
# Prisma generate needs a syntactically valid URL at build time; runtime uses real secrets.
DATABASE_URL = "postgresql://postgres:postgres@localhost:5432/survey?schema=public"
DIRECT_URL = "postgresql://postgres:postgres@localhost:5432/survey?schema=public"

[phases.setup]
aptPkgs = [
  "...",
  "curl",
  "wget",
  "ca-certificates",
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libdbus-1-3",
  "libxkbcommon0",
  "libatspi2.0-0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
]

[phases.install]
# --prod=false: keep turbo, typescript, @nestjs/cli available for build.
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
# Explicit override (no "...") so Nixpacks does not also run a root-wide turbo build.
cmds = [
  "pnpm --filter @workspace/database db:generate",
  "pnpm turbo build --filter=worker...",
  "pnpm --filter worker exec playwright install --with-deps chromium",
]

[start]
cmd = "pnpm --filter worker start"
