global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: api

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:4001"]
        labels:
          service: worker
