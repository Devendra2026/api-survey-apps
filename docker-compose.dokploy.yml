# Dokploy production stack — builds from repo Dockerfiles (turbo prune --docker).
# Services: postgres + minio + redis (Docker) + migrate + api + worker + web
#
# Deploy as ONE Compose application in Dokploy (this file). Docker only — no Nixpacks.
# There is intentionally NO root Dockerfile (do not run web+api+worker in one image).
#
# If Dokploy errors with "open Dockerfile: no such file or directory", the app type is
# wrong: recreate as Docker Compose using THIS file. See docs/ops/dokploy-compose-setup.md.
#
# Secrets: paste into Dokploy Environment UI. Dokploy writes them to `.env` next to this
# compose file (interpolation + container injection via env_file below). Optional
# `.env.production` / DOKPLOY_ENV_FILE is a local/offline fallback (required=false).
# See DEPLOYMENT.md and docs/ops/dokploy-env.md.
#
# Required secrets (no insecure defaults): POSTGRES_PASSWORD, REDIS_PASSWORD,
# MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, DATABASE_URL. Paste deploy/env/dokploy.compose.env.example.
#
# Domains (example):
#   admin.sdvedutech.in   → web:3000
#   backend.sdvedutech.in → api:4000
# Host publish: web 3001→3000, api 4000, worker 4001
#
# Postgres 17 note: volumes created with Postgres 16 are not binary-compatible.
# Dump/restore or recreate the volume before first PG17 start.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy Environment}
      POSTGRES_DB: ${POSTGRES_DB:-survey}
    volumes:
      - survey_pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-survey}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy Environment}
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - survey_redis_data_prod:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  minio:
    # Pin a RELEASE tag; :latest may be scratch-based without curl/wget.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Dokploy Environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Dokploy Environment}
    volumes:
      - survey_minio_data_prod:/data
    command: ["server", "/data", "--console-address", ":9001"]
    # Image includes curl; health endpoint does not need `mc`.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Dokploy Environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Dokploy Environment}
      MINIO_BUCKET: ${MINIO_BUCKET:-api-survey-app}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "MinIO not ready after 30 attempts" >&2
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        # Private bucket — apps use presigned URLs (no anonymous download).
    restart: "no"
    networks:
      - app

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${APP_IMAGE_API:-api-survey-api:prod}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    # Dokploy writes UI env to `.env`; must env_file it or vars never reach the container.
    env_file:
      - path: .env
        required: false
      - path: ${DOKPLOY_ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DIRECT_URL:-${DATABASE_URL:?Set DATABASE_URL or DIRECT_URL in Dokploy Environment}}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:?Set DATABASE_URL or DIRECT_URL in Dokploy Environment}}
    entrypoint: ["sh", "/app/apps/api/docker-entrypoint.migrate.sh"]
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${APP_IMAGE_API:-api-survey-api:prod}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
      - path: ${DOKPLOY_ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy Environment}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      STORAGE_PROVIDER: minio
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-api-survey-app}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-api-survey-app}
    ports:
      - "4000:4000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.survey-api.rule=Host(`${API_HOST:-backend.sdvedutech.in}`)
      - traefik.http.routers.survey-api.entrypoints=websecure
      - traefik.http.routers.survey-api.tls=true
      - traefik.http.routers.survey-api.tls.certresolver=letsencrypt
      - traefik.http.services.survey-api.loadbalancer.server.port=4000
      - traefik.http.services.survey-api.loadbalancer.healthcheck.path=/live
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/live"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - app
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      update_config:
        order: start-first
        failure_action: rollback

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: ${APP_IMAGE_WORKER:-api-survey-worker:prod}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
      - path: ${DOKPLOY_ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      WORKER_PORT: "4001"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy Environment}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      STORAGE_PROVIDER: minio
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-api-survey-app}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-api-survey-app}
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/live"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - app
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      update_config:
        order: start-first
        failure_action: rollback

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://backend.sdvedutech.in}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: ${APP_IMAGE_WEB:-api-survey-web:prod}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ${DOKPLOY_ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.survey-web.rule=Host(`${WEB_HOST:-admin.sdvedutech.in}`)
      - traefik.http.routers.survey-web.entrypoints=websecure
      - traefik.http.routers.survey-web.tls=true
      - traefik.http.routers.survey-web.tls.certresolver=letsencrypt
      - traefik.http.services.survey-web.loadbalancer.server.port=3000
      - traefik.http.services.survey-web.loadbalancer.healthcheck.path=/healthz
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      update_config:
        order: start-first
        failure_action: rollback

networks:
  app:
    driver: bridge

volumes:
  survey_pg_data_prod:
  survey_redis_data_prod:
  survey_minio_data_prod:
