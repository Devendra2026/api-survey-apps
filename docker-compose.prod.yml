name: api-survey-prod

x-deploy-policy: &deploy-policy
  replicas: 1
  update_config:
    order: start-first
    failure_action: rollback
    parallelism: 1
    delay: 10s
  rollback_config:
    order: start-first
    parallelism: 1

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - survey_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: *deploy-policy
    networks:
      - survey

  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/api-survey-apps-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-}
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-https://app.example.com}
      API_URL: ${API_URL:-https://api.example.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.example.com}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-https://app.example.com}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-api-survey-app-prod}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-api-survey-app-prod}
      AWS_S3_PUBLIC_URL: ${AWS_S3_PUBLIC_URL:-}
      AWS_S3_MAX_FILE_SIZE_BYTES: ${AWS_S3_MAX_FILE_SIZE_BYTES:-10485760}
      UPLOAD_MAX_FILE_SIZE_BYTES: ${UPLOAD_MAX_FILE_SIZE_BYTES:-10485760}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy: *deploy-policy
    networks:
      - survey

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/OWNER/api-survey-apps-worker:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WORKER_PORT: ${WORKER_PORT:-4001}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-api-survey-app-prod}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-api-survey-app-prod}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${WORKER_PORT:-4001}/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy: *deploy-policy
    networks:
      - survey

  web:
    image: ${WEB_IMAGE:-ghcr.io/OWNER/api-survey-apps-web:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy: *deploy-policy
    networks:
      - survey

volumes:
  survey_redis_data:

networks:
  survey:
    driver: bridge
